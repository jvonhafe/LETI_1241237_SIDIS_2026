spring.application.name=auth-service
server.port=8084

spring.datasource.url=jdbc:h2:mem:authdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update

# --- JWT ---
# O segredo vem da variavel de ambiente AISAFE_JWT_SECRET (min. 32 caracteres).
# O valor por omissao serve APENAS para desenvolvimento local.
aisafe.jwt.secret=${AISAFE_JWT_SECRET:dev-only-change-me-aisafe-jwt-secret-32bytes-min}
aisafe.jwt.issuer=aisafe-auth-service
aisafe.jwt.user-ttl-minutes=60
aisafe.jwt.service-ttl-minutes=5

# --- Utilizadores iniciais (passwords guardadas com BCrypt) ---
aisafe.bootstrap.admin-password=${AISAFE_ADMIN_PASSWORD:Admin#2026}
aisafe.bootstrap.default-password=${AISAFE_DEFAULT_PASSWORD:Change#Me2026}

# --- Credenciais de servico (autenticacao entre servicos / peers) ---
aisafe.service-accounts.aircraft-service=${AISAFE_SVC_AIRCRAFT_SECRET:dev-aircraft-service-secret}
aisafe.service-accounts.airport-routes-service=${AISAFE_SVC_AIRPORTS_SECRET:dev-airports-service-secret}
aisafe.service-accounts.flight-ops-service=${AISAFE_SVC_FLIGHTS_SECRET:dev-flights-service-secret}
