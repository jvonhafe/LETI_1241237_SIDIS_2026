spring.application.name=airport-routes-service
server.port=8091

# --- Base de Dados Isolada por Instância (Database-per-Service) ---
spring.datasource.url=jdbc:h2:file:./data/airport_routes_${server.port};DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update

# --- RabbitMQ (AMQP) ---
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

# --- Segurança JWT & Auth Service ---
aisafe.jwt.secret=${AISAFE_JWT_SECRET:dev-only-change-me-aisafe-jwt-secret-32bytes-min}
aisafe.auth.url=https://localhost:8084
aisafe.service.id=airport-routes-service
aisafe.service.secret=${AISAFE_SVC_AIRPORTS_SECRET:dev-airports-service-secret}

# --- HTTPS / TLS ---
server.ssl.enabled=true
server.ssl.key-store=classpath:aisafe-keystore.p12
server.ssl.key-store-type=PKCS12
server.ssl.key-store-password=${AISAFE_KEYSTORE_PASSWORD:changeit-dev}
server.ssl.key-alias=aisafe
aisafe.tls.truststore=classpath:aisafe-truststore.p12
aisafe.tls.truststore-password=${AISAFE_KEYSTORE_PASSWORD:changeit-dev}