spring.application.name=demo
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest
server.port=8081
aisafe.jwt.secret=${AISAFE_JWT_SECRET:dev-only-change-me-aisafe-jwt-secret-32bytes-min}
aisafe.auth.url=https://localhost:8084
aisafe.service.id=<airport-routes-service>
aisafe.service.secret=${<AISAFE_SVC_AIRPORTS_SECRET>:<dev-airports-service-secret>}
server.ssl.enabled=true
server.ssl.key-store=classpath:aisafe-keystore.p12
server.ssl.key-store-type=PKCS12
server.ssl.key-store-password=${AISAFE_KEYSTORE_PASSWORD:changeit-dev}
server.ssl.key-alias=aisafe
aisafe.tls.truststore=classpath:aisafe-truststore.p12
aisafe.tls.truststore-password=${AISAFE_KEYSTORE_PASSWORD:changeit-dev}