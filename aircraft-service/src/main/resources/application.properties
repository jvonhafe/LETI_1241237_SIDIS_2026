spring.application.name=aircraft-service
server.port=8081

spring.datasource.url=jdbc:h2:mem:aircraftdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true

spring.jpa.hibernate.ddl-auto=update
spring.jpa.defer-datasource-initialization=true

aircraft.peers.urls=https://localhost:8082,https://localhost:8083

aisafe.jwt.secret=${AISAFE_JWT_SECRET:dev-only-change-me-aisafe-jwt-secret-32bytes-min}

aisafe.auth.url=https://localhost:8084
aisafe.service.id=<aircraft-service>
aisafe.service.secret=${<AISAFE_SVC_AIRCRAFT_SECRET>:<dev-aircraft-service-secret>}

server.ssl.enabled=true
server.ssl.key-store=classpath:aisafe-keystore.p12
server.ssl.key-store-type=PKCS12
server.ssl.key-store-password=${AISAFE_KEYSTORE_PASSWORD:changeit-dev}
server.ssl.key-alias=aisafe
aisafe.tls.truststore=classpath:aisafe-truststore.p12
aisafe.tls.truststore-password=${AISAFE_KEYSTORE_PASSWORD:changeit-dev}