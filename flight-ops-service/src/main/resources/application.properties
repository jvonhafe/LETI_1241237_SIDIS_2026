spring.application.name=flight-ops-service
server.port=8083

# Configuracao da Base de Dados em Memoria (H2)
spring.datasource.url=jdbc:h2:mem:flightdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=false
spring.jpa.hibernate.ddl-auto=update
aisafe.jwt.secret=${AISAFE_JWT_SECRET:dev-only-change-me-aisafe-jwt-secret-32bytes-min}
aisafe.auth.url=http://localhost:8084
aisafe.service.id=flight-ops-service
aisafe.service.secret=${AISAFE_SVC_FLIGHTS_SECRET:dev-flights-service-secret}
